schema: gherkin

context: |
  The agreed design is docs/scoping/design-summary.md. It is authoritative:
  follow it exactly and do not re-decide anything it settles. If something
  it doesn't cover would change behaviour or structure, ask instead of guessing.
  docs/scoping/design-interview.md is the reasoning behind it. Some interview
  rows were later amended, so where the two differ, the summary wins.
  Domain language is defined in docs/CONTEXT.md - use its terms exactly (Company,
  Account, Balance, Transfer, Transfer Batch, Position, Sending Account,
  Receiving Account, Settlement, Pass, Unsettled, Settled, Rejected, Rejection
  Reason) and never the listed "Avoid" words. Architecture decisions are in
  docs/adr/.
  The original brief is docs/MABLE_BACK_END_CODE_TEST.md (local only, not in
  git). Only its scenario, sample files and rubric are requirements. Its
  "Detailed Specification" and "Architecture" sections are superseded by the
  design summary: no FastEndpoints, no NSpec, no separate CSV validator.

rules:
  proposal:
    - Scope and capabilities must match docs/scoping/design-summary.md
  specs:
    - Write every scenario as a fenced ```gherkin block under its `#### Scenario:` header
    - Gherkin steps use docs/CONTEXT.md domain terms; amounts in dollars and cents, account numbers as 16-digit strings
    - Specs state observable behaviour only; class and method names belong in design.md
  design:
    - Always write design.md, taking the solution layout, domain model and API shape from docs/scoping/design-summary.md
    - Reference the design summary rather than restating it; record only decisions it leaves open
  tasks:
    - Group tasks in the order of the design summary's Delivery plan (Domain, Application, Data, Api and README); test-first, so each task writes the failing spec before the code
    - Specs use xUnit v3 and Shouldly with nested describe/context/it classes (ADR 0002)

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
